name: Build & Release Guncord

on:
  push:
    tags:
      - "v*"          # triggered on : git tag v1.0.0 && git push --tags

permissions:
  contents: write    # necessary to create the GitHub Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Guncord renderer (standalone)
        run: pnpm buildStandalone

      - name: Build & Package Electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node electron-builder.config.cjs || true
          npx electron-builder --config electron-builder.config.cjs --win --publish always

      - name: Package guncord-dist.zip
        shell: pwsh
        run: |
          # guncord-dist.zip — structure expected by the installer (Program.cs EnsureDistAsync):
          # the root of the zip = _distDir (%LOCALAPPDATA%\Guncord\dist\)
          # => patcher.js MUST be in the root directory, not in a subfolder dist\desktop\
          $staging = "guncord-dist-staging"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null

          # Compiled JS files: we copy the CONTENT of dist\desktop\ at the root of staging
          # (patcher.js, renderer.js, preload.js, etc. directement accessibles)
          if (Test-Path "dist\desktop") {
            Copy-Item "dist\desktop\*" "$staging\" -Recurse -Force
          } elseif (Test-Path "dist") {
            # Fallback: old structure
            Copy-Item "dist\*" "$staging\" -Recurse -Force
          }

          # server (voice/stream server)
          if (Test-Path "server") {
            Copy-Item "server" "$staging\server" -Recurse
          }

          # Static assets from release/guncord-dist (ffmpeg.dll, modules, mac/, multi-instance-icons/, etc.)
          if (Test-Path "release\guncord-dist") {
            Copy-Item "release\guncord-dist\*" "$staging\" -Recurse -Force
          }

          # Entry-point files
          foreach ($f in @("guncord-index.js", "guncord-preload.js")) {
            if (Test-Path $f) { Copy-Item $f "$staging\" }
          }

          # Sanity check: patcher.js must be in the root directory
          if (-not (Test-Path "$staging\patcher.js")) {
            Write-Error "BUILD ERROR: patcher.js If missing from the root of the staging environment, the installer will not be able to function."
            exit 1
          }

          Compress-Archive -Path "$staging\*" -DestinationPath "guncord-dist.zip" -Force
          Write-Host "guncord-dist.zip created ($($(Get-Item guncord-dist.zip).Length / 1MB) MB)"

      - name: Upload guncord-dist.zip to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            guncord-dist.zip
            dist/desktop.asar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

